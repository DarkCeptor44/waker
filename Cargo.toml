[workspace]
resolver = "3"
members = ["waker", "waker-cli", "waker-server"]

[workspace.package]
version = "1.1.0"
authors = ["DarkCeptor44"]
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/DarkCeptor44/waker"
repository = "https://github.com/DarkCeptor44/waker"

[workspace.dependencies]
# waker
anyhow = "1.0.100"
serde = "1.0.228"
thiserror = "2.0.18"

# waker-cli
clap = "4.5.56"
colored = "3.1.1"
configura = "1.1.0"
handy-rs = "2.2.0"
inquire = "0.9.2"
tabela = "0.2.0"
waker = { version = "1.1.0", path = "./waker" }

# waker-server
axum = "0.8.9"
chrono = "0.4.44"
dotenvy = "0.15.7"
log = "0.4.29"
num_cpus = "1.17.0"
rayon = "1.12.0"
simplelog = "0.12.2"
tokio = "1.52.2"
tower = "0.5.3"
tower-http = "0.6.8"
utoipa = "5.4.0"
utoipa-swagger-ui = "9.0.2"

# dev-dependencies
divan = "0.1.21"
serde_json = "1.0.149"
